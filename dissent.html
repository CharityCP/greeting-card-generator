<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Join "The Dissenting Madness"</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/alfuix/dist/css/alfuix.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Dissent into Madness</h1>

    <div class="navigate">
        <nav>
            <ul>
                <li><b><a href="unity.html">Unity</a></b></li>
                <li><b><a href="index.html">HOME</a></b></li>
                <li><b><a href="domination.html">Domination</a></b></li>
                <li><b><a href="elite.html">Elitest</a></b></li>
            </ul>
        </nav>
    </div>

    <h2>Let's Dissent into a Chronicled Madlib</h2>
</header>


<main>

    <div class="inputs">

        <label>
            A hero name
            <input id="heroInputBox"
                   name="hero"
                   type="text"
                   required
                   placeholder="Superman, Captain America...">
        </label>

        <label>
            A villain name
            <input id="villianInputBox"
                   name="villian"
                   type="text"
                   required
                   placeholder="Lex Luthor, Thanos...">
        </label>

        <label>
            First Adjective
            <input id="adjective1InputBox"
                   name="adjective1"
                   type="text"
                   required
                   placeholder="Small, blue...">
        </label>

        <label>
            Post-Apocalyptic location
            <input id="locationInputBox"
                   name="apocalypticLocation"
                   type="text"
                   required
                   placeholder="Wastelands, city ruins...">
        </label>

        <label>
            Sci-Fi Weapon
            <input id="weaponInputBox"
                   name="sciFiWeapon"
                   type="text"
                   required
                   placeholder="Lightsaber, plasma gun...">
        </label>

        <label>
            Type of Vehicle
            <input id="vehicleInputBox"
                   name="vehicleType"
                   type="text"
                   required
                   placeholder="Mercedes, BMW...">
        </label>

        <label>
            An alien creature
            <input id="alienInputBox"
                   name="alienCreature"
                   type="text"
                   required
                   placeholder="Klingon, Vulcan...">
        </label>

        <label>
            First Verb
            <input id="verb1InputBox"
                   name="verb1"
                   type="text"
                   required
                   placeholder="Dance, run...">
        </label>

        <label>
            Second Adjective
            <input id="adjective2InputBox"
                   name="adjective2"
                   type="text"
                   required
                   placeholder="Frantically, surprisingly...">
        </label>

        <label>
            Name of powerful artifact
            <input id="artifactInputBox"
                   name="artifact"
                   type="text"
                   required
                   placeholder="Infinity Stones, Vibranium...">
        </label>

        <label>
            A Plural Noun
            <input id="pluralNounInputBox"
                   name="pluralNoun"
                   type="text"
                   required
                   placeholder="Puppies, bowling balls...">
        </label>

        <label>
            Verb ending in -ING
            <input id="verbIngInputBox"
                   name="verbIng"
                   type="text"
                   required
                   placeholder="Creating, exercising...">
        </label>

        <label>
            Type of Explosion
            <input id="explosionInputBox"
                   name="explosion"
                   type="text"
                   required
                   placeholder="Bombs, fire bursts...">
        </label>

        <label>
            Third Adjective
            <input id="adjective3InputBox"
                   name="adjective3"
                   type="text"
                   required
                   placeholder="Fastest, tallest...">
        </label>

        <label>
            A Body part
            <input id="bodyPartInputBox"
                   name="bodyPart"
                   type="text"
                   required
                   placeholder="Arm, leg, knee...">
        </label>

        <label>
            Futuristic Technology
            <input id="futureTechInputBox"
                   name="futureTech"
                   type="text"
                   required
                   placeholder="Hover cars, beam transporter...">
        </label>

        <label>
            Sound Effect
            <input id="soundEffectInputBox"
                   name="soundEffect"
                   type="text"
                   required
                   placeholder="Kablam, Splatt...">
        </label>

        <label>
            Second Verb
            <input id="verb2InputBox"
                   name="verb2"
                   type="text"
                   required
                   placeholder="Fry, simmer...">
        </label>

        <label>
            Battle Call
            <input id="battleCallInputBox"
                   name="battleCall"
                   type="text"
                   required
                   placeholder="Hoorah, Banzai...">
        </label>

        <label>
            Fourth Adjective
            <input id="adjective4InputBox"
                   name="adjective4"
                   type="text"
                   required
                   placeholder="Green, slimy...">
        </label>

    </div>


    <div class="textBox">
        <label for="story-output">
            Madlib Whacky Story!
        </label>

        <textarea id="story-output"
                  rows="15"
                  cols="60"
                  placeholder="Your finished story will appear here..."
                  readonly></textarea>
    </div>

</main>


<button id="submitButton" type="button">
    Dissenting Madlib
</button>


<script src="script.js"> </script>

</body>
</html>
