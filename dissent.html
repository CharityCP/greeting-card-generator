<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Join "The Dissenting Madness"</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/alfuix/dist/css/alfuix.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Dissent into Madness</h1>

    <div class="navigate">
        <nav>
            <ul>
                <li><b><a href="unity.html">Unity</a></b></li>
                <li><b><a href="index.html">HOME</a></b></li>
                <li><b><a href="domination.html">Domination</a></b></li>
                <li><b><a href="elite.html">Elitest</a></b></li>
            </ul>
        </nav>
    </div>

    <h2>Let's Dissent into a Chronicled Madlib</h2>
</header>


<main>

    <div class="inputs">

        <label>
            A hero name
            <input id="heroInputBox"
                   name="hero"
                   type="text"
                   required
                   placeholder="Superman, Captain America...">
        </label>

        <label>
            A villain name
            <input id="villianInputBox"
                   name="villian"
                   type="text"
                   required
                   placeholder="Lex Luthor, Thanos...">
        </label>

        <label>
            First Adjective
            <input id="adjective1InputBox"
                   name="adjective1"
                   type="text"
                   required
                   placeholder="Small, blue...">
        </label>

        <label>
            Post-Apocalyptic location
            <input id="locationInputBox"
                   name="apocalypticLocation"
                   type="text"
                   required
                   placeholder="Wastelands, city ruins...">
        </label>

        <label>
            Sci-Fi Weapon
            <input id="weaponInputBox"
                   name="sciFiWeapon"
                   type="text"
                   required
                   placeholder="Lightsaber, plasma gun...">
        </label>

        <label>
            Type of Vehicle
            <input id="vehicleInputBox"
                   name="vehicleType"
                   type="text"
                   required
                   placeholder="Mercedes, BMW...">
        </label>

        <label>
            An alien creature
            <input id="alienInputBox"
                   name="alienCreature"
                   type="text"
                   required
                   placeholder="Klingon, Vulcan...">
        </label>

        <label>
            First Verb
            <input id="verb1InputBox"
                   name="verb1"
                   type="text"
                   required
                   placeholder="Dance, run...">
        </label>

        <label>
            Second Adjective
            <input id="adjective2InputBox"
                   name="adjective2"
                   type="text"
                   required
                   placeholder="Frantically, surprisingly...">
        </label>

        <label>
            Name of powerful artifact
            <input id="artifactInputBox"
                   name="artifact"
                   type="text"
                   required
                   placeholder="Infinity Stones, Vibranium...">
        </label>

        <label>
            A Plural Noun
            <input id="pluralNounInputBox"
                   name="pluralNoun"
                   type="text"
                   required
                   placeholder="Puppies, bowling balls...">
        </label>

        <label>
            Verb ending in -ING
            <input id="verbIngInputBox"
                   name="verbIng"
                   type="text"
                   required
                   placeholder="Creating, exercising...">
        </label>

        <label>
            Type of Explosion
            <input id="explosionInputBox"
                   name="explosion"
                   type="text"
                   required
                   placeholder="Bombs, fire bursts...">
        </label>

        <label>
            Third Adjective
            <input id="adjective3InputBox"
                   name="adjective3"
                   type="text"
                   required
                   placeholder="Fastest, tallest...">
        </label>

        <label>
            A Body part
            <input id="bodyPartInputBox"
                   name="bodyPart"
                   type="text"
                   required
                   placeholder="Arm, leg, knee...">
        </label>

        <label>
            Futuristic Technology
            <input id="futureTechInputBox"
                   name="futureTech"
                   type="text"
                   required
                   placeholder="Hover cars, beam transporter...">
        </label>

        <label>
            Sound Effect
            <input id="soundEffectInputBox"
                   name="soundEffect"
                   type="text"
                   required
                   placeholder="Kablam, Splatt...">
        </label>

        <label>
            Second Verb
            <input id="verb2InputBox"
                   name="verb2"
                   type="text"
                   required
                   placeholder="Fry, simmer...">
        </label>

        <label>
            Battle Call
            <input id="battleCallInputBox"
                   name="battleCall"
                   type="text"
                   required
                   placeholder="Hoorah, Banzai...">
        </label>

        <label>
            Fourth Adjective
            <input id="adjective4InputBox"
                   name="adjective4"
                   type="text"
                   required
                   placeholder="Green, slimy...">
        </label>

    </div>


    <div class="textBox">
        <label for="story-output">
            Madlib Whacky Story!
        </label>

        <textarea id="story-output"
                  rows="15"
                  cols="60"
                  placeholder="Your finished story will appear here..."
                  readonly></textarea>
    </div>

</main>


<button id="submitButton" type="button">
    Dissenting Madlib
</button>


<script>

const makeButton = document.getElementById("submitButton");
const storyOutput = document.getElementById("story-output");


function makeCard() {

    // Get user's answers
    const hero = document.getElementById("heroInputBox").value;
    const villian = document.getElementById("villianInputBox").value;
    const adjective1 = document.getElementById("adjective1InputBox").value;
    const storyLocation = document.getElementById("locationInputBox").value;
    const weapon = document.getElementById("weaponInputBox").value;
    const vehicle = document.getElementById("vehicleInputBox").value;
    const alien = document.getElementById("alienInputBox").value;
    const verb1 = document.getElementById("verb1InputBox").value;
    const adjective2 = document.getElementById("adjective2InputBox").value;
    const artifact = document.getElementById("artifactInputBox").value;
    const pluralNoun = document.getElementById("pluralNounInputBox").value;
    const verbing = document.getElementById("verbIngInputBox").value;
    const explosion = document.getElementById("explosionInputBox").value;
    const adjective3 = document.getElementById("adjective3InputBox").value;
    const bodyPart = document.getElementById("bodyPartInputBox").value;
    const futureTech = document.getElementById("futureTechInputBox").value;
    const soundEffect = document.getElementById("soundEffectInputBox").value;
    const verb2 = document.getElementById("verb2InputBox").value;
    const battleCall = document.getElementById("battleCallInputBox").value;
    const adjective4 = document.getElementById("adjective4InputBox").value;


    // Madlib builder
    const finishedStory =
        "Long after the world had been destroyed, the last survivors lived among the ruins of "
        + storyLocation + ". "

        + "The forces of good, led by " + hero
        + ", a brave warrior carrying the " + artifact + ". "

        + "Their great enemy was " + villian
        + ", the ruler of the " + adjective1 + " empire. "

        + "\"Today our world ends!\" shouted " + villian + ". "

        + hero + " stepped forward. "
        + "\"I will never let you destroy what remains of humanity.\" "

        + "The battle began. "

        + "The hero began " + verbing
        + " across the battlefield, while "
        + pluralNoun + " flew through the air. "

        + "Suddenly, a massive " + explosion
        + " rocked the ground. "

        + "\"" + battleCall + "!\" yelled " + hero
        + ", using a mysterious " + futureTech + ". "

        + "The hero managed to " + verb1
        + " directly toward the enemy fortress. "

        + "But " + villian + " was waiting. "

        + "The villain raised a " + weapon
        + " and fired. " + soundEffect + "! "

        + "The blast struck " + hero
        + " in the " + bodyPart
        + ", knocking them to the ground. "

        + "\"You're finished!\" laughed " + villian + ". "

        + "But the hero stood back up. "

        + "With an expression of " + adjective2
        + ", " + hero + " raised the " + artifact
        + " and it began to glow with " + adjective4
        + " energy. "

        + "The villain charged. The hero charged. "

        + "Both sides " + verb2
        + " toward each other as the entire battlefield shook. "

        + "Then came the final " + explosion + ". "

        + "When the smoke cleared, only the heroic warrior remained standing. "

        + "The forces of evil had been defeated. "

        + "The survivors looked toward the ruined sky as the hero declared, "
        + "\"Even after the end of the world, there is still hope.\" "

        + "And for the first time in generations, humanity believed that the future could be "
        + adjective3 + ".";


    // Put the finished story into the textarea
    storyOutput.value = finishedStory;

}


// Makecard runs when button is clicked
makeButton.addEventListener("click", makeCard);

</script>

</body>
</html>
